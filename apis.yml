description: 'creativeLIVE (CreativeLive) is an online learning platform offering more
  than 2,300 on-demand courses and live interactive classes taught by working professionals
  across photography, video and filmmaking, graphic and web design, business and entrepreneurship,
  arts and crafts, audio and music production, and AI and technology. Learners access
  practical, skill-based instruction through a subscription, with certificates of completion
  available. Surfaced as a portfolio company of GV and added to the API Evangelist network;
  creativeLIVE exposes no public developer API, but does publish a machine-readable
  llms.txt course index for AI agents.'
